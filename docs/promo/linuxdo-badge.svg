<svg xmlns="http://www.w3.org/2000/svg" width="840" height="128" viewBox="0 0 840 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="55%" stop-color="#111A26"/>
      <stop offset="100%" stop-color="#0B131D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="840" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5C451" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#10D676" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#F5B82E"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22E584"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.14" cy="0.5" r="0.32">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.88" cy="0.5" r="0.30">
      <stop offset="0%" stop-color="#10D676" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10D676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="838" height="126" rx="22" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="126" rx="22" fill="url(#glowL)"/>
  <rect x="1" y="1" width="838" height="126" rx="22" fill="url(#glowR)"/>

  <!-- LINUX DO geometric emblem (signature tri-band circle: dark / light / amber) -->
  <g transform="translate(34, 30)">
    <rect width="68" height="68" rx="18" fill="#161E2B" stroke="#F5C451" stroke-opacity="0.38" stroke-width="1.2"/>
    <clipPath id="ldCircle">
      <circle cx="34" cy="34" r="22"/>
    </clipPath>
    <g clip-path="url(#ldCircle)">
      <rect x="12" y="12" width="44" height="15" fill="#18181B"/>
      <rect x="12" y="27" width="44" height="14" fill="#F8FAFC"/>
      <rect x="12" y="41" width="44" height="15" fill="url(#goldGrad)"/>
    </g>
    <circle cx="34" cy="34" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
  </g>

  <!-- Main copy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="122" y="47" fill="#FDE68A" font-size="13" font-weight="700" letter-spacing="1.2">COMMUNITY FRIEND LINK · 社区友情链接</text>
    <text x="122" y="76" fill="#FFFFFF" font-size="22" font-weight="800">我的开源项目已链接认可 LINUX DO 社区</text>
    <text x="122" y="101" fill="#94A3B8" font-size="14" font-weight="500">真诚、友善、团结、专业 · 新的理想型技术社区（linux.do）</text>
  </g>

  <!-- Right CTA pill -->
  <g transform="translate(658, 43)">
    <rect width="148" height="42" rx="21" fill="url(#btnGrad)"/>
    <text x="74" y="26" text-anchor="middle" fill="#04150B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="14.5" font-weight="800">访问 linux.do →</text>
  </g>
</svg>
