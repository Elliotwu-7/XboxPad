name: XboxPad
options:
  bundleIdPrefix: com.elliot
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0.34"
    CURRENT_PROJECT_VERSION: "35"

targets:
  XboxPad:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: XboxPad
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliot.xboxpad
        INFOPLIST_FILE: XboxPad/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lresolv"
    dependencies:
      - framework: Frameworks/XboxPadNano.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalFX.framework
      - sdk: Network.framework
      - sdk: Photos.framework
      - sdk: QuartzCore.framework
      - sdk: SafariServices.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: VideoToolbox.framework

schemes:
  XboxPad:
    build:
      targets:
        XboxPad: all
    run:
      config: Debug
    archive:
      config: Release
